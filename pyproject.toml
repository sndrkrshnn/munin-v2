[tool.poetry]
name = "munin-v2"
version = "0.1.0"
description = "Munin - Odin's raven Telegram bot that brings information from around the world"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "text"}]

[tool.poetry.dependencies]
python = "^3.11"
beautifulsoup4 = "^4.12.3"
fastapi = "^0.109.0"
numpy = "^2.0.0"
openai = "^1.42.0"
openmeteo-requests = "^1.3.0"
pillow = "^10.4.0"
python-dotenv = "^1.0.0"
python-telegram-bot = "^21.4"
requests = "^2.32.3"
requests-cache = "^1.2.1"
retry-requests = "^2.0.0"
uvicorn = "^0.30.6"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
